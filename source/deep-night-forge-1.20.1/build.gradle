plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.35'
}
version = '1.4.1'
group = 'dev.deepnight'
base.archivesName = 'deep-night-forge-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { deepnight { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest') || project.hasProperty('bossPreview') || project.hasProperty('bossMenuTest')) {
                property 'deepnight.smokeTest', 'true'
                if (project.hasProperty('bossPreview')) property 'deepnight.bossPreview', 'true'
                if (project.hasProperty('bossMenuTest')) property 'deepnight.bossMenuTest', 'true'
                args '--width', '1440', '--height', '1000'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-boss-audit-1.3.2')
            property 'forge.enabledGameTestNamespaces', 'deepnight'
        }
    }
}
repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    flatDir { dirs 'compat-mods', '../fantasy-races-forge-1.20.1/compat-mods' }
}
configurations { geckoMath { transitive = false } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    def gecko = 'local.fantasyraces:geckolib-forge-1.20.1-4.8.4:1.0'
    implementation fg.deobf(gecko)
    geckoMath gecko
    // GeckoLib supplies this nested library at runtime; expose it only for compiling Molang queries.
    compileOnly files(provider { zipTree(configurations.geckoMath.singleFile).matching { include 'META-INF/jarjar/mclib*.jar' }.files })
    if (project.hasProperty('withCombat')) {
        ['bettercombat-forge-1.9.0+1.20.1','cloth-config-11.1.136-forge','player-animation-lib-forge-1.0.2-rc1+1.20'].each {
            runtimeOnly fg.deobf("local.fantasyraces:${it}:1.0")
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','2000'] }
// Keep future imported bosses from reintroducing nullable registry lookups.
tasks.register('verifySoundLookups') {
    inputs.dir('src/main/java')
    inputs.dir('src/main/resources/assets')
    doLast {
        def errors = []
        def catalogs = [:]
        ['simple_mobs', 'mobosses', 'deepnight'].each { namespace ->
            catalogs[namespace] = new groovy.json.JsonSlurper().parse(file("src/main/resources/assets/${namespace}/sounds.json"))
        }
        fileTree('src/main/java').matching { include '**/*.java'; exclude '**/qa/**' }.each { source ->
            def code = source.getText('UTF-8')
            if (source.name != 'SafeSounds.java' &&
                (code =~ /(?s)(SOUND_EVENTS|SOUND_EVENT)\s*\.\s*(getValue|get|getHolder)\s*\(/).find()) {
                errors << "${source.name}: use SafeSounds.resolve for sound registry lookups"
            }
            (code =~ /SafeSounds\.resolve\("([^\"]*)"\)/).each { match ->
                def id = match[1]
                if (!id.isEmpty()) {
                    def parts = id.contains(':') ? id.split(':', 2) : ['minecraft', id]
                    if (catalogs.containsKey(parts[0]) && !catalogs[parts[0]].containsKey(parts[1])) {
                        errors << "${source.name}: missing sound definition ${id}"
                    }
                }
            }
        }
        if (!errors.isEmpty()) throw new GradleException(errors.unique().join('\n'))
    }
}
tasks.named('compileJava') { dependsOn 'verifySoundLookups' }
tasks.register('verifyBossAdvancements') {
    inputs.dir('src/main/java/dev/deepnight/source')
    inputs.dir('src/main/resources/data')
    doLast {
        fileTree('src/main/java/dev/deepnight/source').matching { include '**/*.java' }.each { source ->
            def code = source.getText('UTF-8')
            if (source.name != 'SourceAdvancements.java' && code.contains('getOrStartProgress(')) {
                throw new GradleException("${source.name}: use SourceAdvancements.award for optional source advancements")
            }
            (code =~ /SourceAdvancements\.award\([^,]+,\s*"([^\"]+)"\)/).each { match ->
                def parts = match[1].split(':', 2)
                if (parts.length != 2 || !file("src/main/resources/data/${parts[0]}/advancements/${parts[1]}.json").exists()) {
                    throw new GradleException("${source.name}: missing boss advancement ${match[1]}")
                }
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyBossAdvancements' }
jar {
    exclude 'dev/deepnight/qa/**'
    exclude 'data/deepnight/structures/empty.nbt'
    from('ASSET-NOTES.txt')
    manifest.attributes('Implementation-Title': 'The Deep Night', 'Implementation-Version': project.version)
    finalizedBy 'reobfJar'
}
